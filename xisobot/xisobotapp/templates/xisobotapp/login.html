
<!DOCTYPE html>
<html lang="uz">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            background: #f1f5f9;
            font-family: Arial, sans-serif;
            padding: 20px;
        }

        .box {
            width: 100%;
            max-width: 420px;
            padding: 30px;
            background: white;
            border-radius: 15px;
            box-shadow: 0 5px 25px #00000010;
        }

        h1 {
            text-align: center;
            color: #1e293b;
        }

        input {
            width: 100%;
            padding: 12px;
            margin: 8px 0;
            border: 1px solid #cbd5e1;
            border-radius: 8px;
        }

        button {
            width: 100%;
            padding: 13px;
            margin-top: 15px;
            background: #2563eb;
            color: white;
            border: none;
            border-radius: 8px;
            cursor: pointer;
        }

        a {
            color: #2563eb;
            text-decoration: none;
        }

        .errorlist {
            color: #dc2626;
        }
    </style>
</head>

<body>
<div class="box">
    <h1>🔐 Login</h1>

    <form method="POST">
        {% csrf_token %}

        {{ form.as_p }}

        <button type="submit">Kirish</button>
    </form>

    <p>Hisobingiz yo‘qmi?
        <a href="{% url 'register' %}">Registratsiya</a>
    </p>
</div>
</body>
</html>
